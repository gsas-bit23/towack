[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Sellout tests mint and claim 5000 times in one test; lift the 1B default.
gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
bsc_testnet = "https://bsc-testnet-rpc.publicnode.com"
bsc_mainnet = "https://bsc-dataseed.bnbchain.org"
